name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar Testes
        run: pytest -v

      - name: Subir a API e testar requisição (Integração)
        run: |
          # O '&' roda a API em background para não travar o Runner
          fastapi run main.py --port 8000 &

          # Dá 3 segundos para o servidor ligar completamente
          sleep 3

          # O '-f' faz o CI falhar se a API retornar erro (404, 500...)
          curl -f http://localhost:8000/
          curl -f http://localhost:8000/somar/10/20
